<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Smart Work Report</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #4a4a4a;
      padding: 30px 0;
      min-height: 100vh;
    }
    .main-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      max-width: 950px;
      margin: 0 auto;
      border: 3px solid #fff;
    }
    .header-title { 
      color: #5c7cfa; 
      font-weight: 700; 
      text-shadow: 1px 1px 0px rgba(255,255,255,1); 
    }
    .form-control, .form-select {
      border-radius: 12px;
      border: 1px solid #dbe4ff;
      padding: 10px 15px;
      background-color: #f8f9fa;
      transition: all 0.3s ease;
    }
    .form-control:focus, .form-select:focus {
      border-color: #748ffc;
      box-shadow: 0 0 0 0.25rem rgba(116, 143, 252, 0.25);
      background-color: #fff;
    }
    .task-list { max-height: 500px; overflow-y: auto; padding-right: 5px; }
    .task-detail { white-space: pre-wrap; overflow-wrap: anywhere; flex: 1; min-width: 0; }
    @media (max-width: 600px) {
      body { padding: 12px 0; }
      .main-container { padding: 20px 14px; }
      .section-box { padding: 16px 10px; }
      .task-item { flex-direction: column; align-items: stretch !important; }
      .task-item .btn-group { align-self: flex-end; }
    }
    .task-item { 
      border-left: 6px solid #ffb3c6; 
      background: #fff0f3; 
      margin-bottom: 12px; 
      padding: 15px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      transition: transform 0.2s; 
    }
    .task-item:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
    .btn-export { 
      background: linear-gradient(90deg, #38d9a9, #20c997); 
      color: white; 
      border: none; 
      font-weight: 600; 
      border-radius: 50px;
      padding: 10px 25px;
      box-shadow: 0 4px 15px rgba(32, 201, 151, 0.3);
    }
    .btn-export:hover { background: linear-gradient(90deg, #20c997, #12b886); color: white; transform: scale(1.02); }
    .btn-primary { 
      background: linear-gradient(90deg, #748ffc, #5c7cfa); 
      border: none; 
      border-radius: 50px;
      font-weight: 600;
      padding: 10px 25px;
      box-shadow: 0 4px 15px rgba(92, 124, 250, 0.3);
    }
    .btn-primary:hover { background: linear-gradient(90deg, #5c7cfa, #4c6ef5); transform: scale(1.02); }
    .section-box {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 25px;
      border: 1px dashed #bac8ff;
    }
    
    /* Footer Styling */
    .app-footer {
      color: #3b5bdb;
      font-size: 0.95rem;
      padding-top: 25px;
      padding-bottom: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container main-container">
  <h3 class="text-center header-title mb-4">✨ ระบบบันทึกผลการปฏิบัติงานประจำเดือน ✨</h3>
  <div id="syncPanel" class="alert alert-info mb-4">
    <div id="syncStatus" role="status" aria-live="polite">กำลังเปิดรายงาน…</div>
    <div class="d-flex flex-wrap gap-2 mt-2">
      <button id="retryButton" type="button" class="btn btn-sm btn-outline-primary" onclick="retrySync()" hidden>ลองอีกครั้ง</button>
      <button id="backupButton" type="button" class="btn btn-sm btn-outline-secondary" onclick="downloadDraft()" hidden>ดาวน์โหลดฉบับร่าง JSON</button>
      <button id="discardButton" type="button" class="btn btn-sm btn-outline-danger" onclick="discardDraft()" hidden>โหลดข้อมูลจากชีตใหม่</button>
    </div>
  </div>
  
  <!-- ส่วนข้อมูลบุคคล -->
  <div class="row g-3 mb-4 pb-4" style="border-bottom: 2px dashed #dbe4ff;">
    <div class="col-md-3">
      <label class="form-label text-primary fw-bold">🗓️ เดือน</label>
      <select id="selMonth" class="form-select" onchange="loadData()"></select>
    </div>
    <div class="col-md-3">
      <label class="form-label text-primary fw-bold">📅 ปี (พ.ศ.)</label>
      <select id="selYear" class="form-select" onchange="loadData()"></select>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold">👤 ชื่อ-สกุล</label>
      <input type="text" id="empName" class="form-control" placeholder="ระบุชื่อ-สกุล" value="นายวรรัตน์ จันทร์เจริญ" onchange="loadData(); saveProfile();" maxlength="200">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold">💼 ตำแหน่ง</label>
      <input type="text" id="empPosition" class="form-control" placeholder="ระบุตำแหน่ง" value="นักวิชาการเผยแพร่ปฏิบัติการ" onchange="profileChanged()" maxlength="300" disabled>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold">🏢 ประเภทบุคลากร</label>
      <select id="empType" class="form-select" onchange="profileChanged()" disabled>
        <option value="ข้าราชการ">ข้าราชการ</option>
        <option value="พนักงานราชการ">พนักงานราชการ</option>
      </select>
    </div>
  </div>

  <!-- ส่วนบันทึกงาน -->
  <div class="row g-3 mb-4 section-box">
    <h5 class="text-primary fw-bold mb-2">📝 บันทึกรายการปฏิบัติงาน</h5>
    <div class="col-md-12">
      <label class="form-label fw-semibold">📌 ประเภทงาน</label>
      <div class="d-flex gap-2">
        <select id="taskCategory" class="form-select" onchange="checkNewCategory()" data-edit disabled></select>
        <button type="button" id="btnDeleteCategory" class="btn btn-outline-danger d-none" onclick="deleteCustomCategory()" title="ลบหมวดหมู่นี้" data-edit disabled>🗑️</button>
      </div>
    </div>
    <div class="col-md-12 d-none" id="newCategoryDiv">
      <input type="text" id="newCategoryInput" class="form-control" placeholder="พิมพ์ชื่อประเภทงานใหม่ที่นี่..." maxlength="490" data-edit disabled>
    </div>
    <div class="col-md-12">
      <label class="form-label fw-semibold">📝 รายละเอียดงาน / ผลความคืบหน้า</label>
      <textarea id="taskDetail" class="form-control" rows="3" placeholder="ระบุรายละเอียดงานที่ทำ... (Enter เพิ่มงาน, Shift+Enter ขึ้นบรรทัดใหม่)" maxlength="10000" data-edit disabled></textarea>
    </div>
    <div class="col-md-12 text-end mt-3">
      <button id="addTaskButton" type="button" class="btn btn-primary px-4" onclick="addTask()" data-edit disabled>+ เพิ่มผลงาน</button>
    </div>
  </div>

  <!-- ส่วนแสดงผล -->
  <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-3 mt-5">
    <h5 class="mb-0 fw-bold" style="color: #4a4a4a;">📁 ผลงานในเดือนนี้</h5>
    <button class="btn btn-export px-4" onclick="generateWord()">📥 โหลดไฟล์ Word</button>
  </div>
  
  <div id="taskListContainer" class="task-list mt-3">
    <!-- รายการงานจะแสดงที่นี่ -->
  </div>

</div>

<!-- Footer Credits -->
<div class="container text-center app-footer mt-3">
  <p class="mb-1 fw-bold fs-6">© 2026 ระบบบันทึกผลการปฏิบัติงานประจำเดือน</p>
  <p class="mb-0 opacity-75" style="font-size: 0.9rem;">พัฒนาโดย นายวรรัตน์ จันทร์เจริญ | นักวิชาการเผยแพร่ปฏิบัติการ | กลุ่มสื่อสารองค์กร สลก.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // APP_CONTROLLER_START
  // Source for the controller embedded in apps-script/Index.html. Run node scripts/build.cjs after edits.
  const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const defaultCategories = [
    '1. เขียนข่าว / ถ่ายภาพ / ถ่ายภาพเคลื่อนไหว เผยแพร่ประชาสัมพันธ์ ผ่านช่องทางออนไลน์ ของกรมคุมประพฤติ',
    '2. ออกแบบ Infographic (ภารกิจตามนโยบาย / ข้อสั่งการ)',
    '3. VDO Presentation / VDO Footage',
    '4. งานอื่น ๆ ที่ได้รับมอบหมาย'
  ];
  let currentTasks = [];
  let activeRecord = null;
  let revision = '0';
  let isFetching = false;
  let isSaving = false;
  let isReady = false;
  let dirty = false;
  let conflict = false;
  let loadError = false;
  let loadToken = 0;
  let storageUnavailable = false;
  const memoryStorage = new Map();
  const el = id => document.getElementById(id);

  function readLocal(key, fallback = null) {
    let raw;
    try { raw = memoryStorage.has(key) ? memoryStorage.get(key) : localStorage.getItem(key); }
    catch (_) { storageUnavailable = true; raw = memoryStorage.get(key); }
    if (!raw) return fallback;
    try { return JSON.parse(raw); } catch (_) { return fallback; }
  }
  function writeLocal(key, value) {
    const raw = JSON.stringify(value);
    try { localStorage.setItem(key, raw); memoryStorage.delete(key); }
    catch (_) { storageUnavailable = true; memoryStorage.set(key, raw); }
  }
  function selectedRecord() {
    const month = Number(el('selMonth').value);
    const year = el('selYear').value;
    const fullName = el('empName').value.trim();
    return { month, year, fullName, monthYear: `${thaiMonths[month - 1]} ${year}`,
      key: `work_report_v2_${encodeURIComponent(fullName)}_${year}_${month}` };
  }
  function validTasks(tasks) {
    return Array.isArray(tasks) && tasks.every(t => t &&
      (typeof t.id === 'string' || typeof t.id === 'number') &&
      typeof t.category === 'string' && typeof t.detail === 'string');
  }
  function cacheRecord() {
    if (!activeRecord) return;
    writeLocal(activeRecord.key, { tasks: currentTasks, revision, dirty,
      position: el('empPosition').value.trim(), employeeType: el('empType').value });
  }
  function saveProfile() {
    writeLocal('work_report_profile_v2', { fullName: el('empName').value.trim(),
      position: el('empPosition').value, employeeType: el('empType').value });
  }
  function loadProfile() {
    const profile = readLocal('work_report_profile_v2');
    if (!profile || typeof profile !== 'object') return;
    if (typeof profile.fullName === 'string') el('empName').value = profile.fullName;
    if (typeof profile.position === 'string') el('empPosition').value = profile.position;
    if (['ข้าราชการ','พนักงานราชการ'].includes(profile.employeeType)) el('empType').value = profile.employeeType;
  }
  function initSelects() {
    const date = new Date();
    const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Bangkok', year:'numeric', month:'numeric'}).formatToParts(date);
    const year = Number(parts.find(p => p.type === 'year').value) + 543;
    thaiMonths.forEach((month, i) => el('selMonth').options.add(new Option(month, i + 1)));
    el('selMonth').value = parts.find(p => p.type === 'month').value;
    for (let y = Math.min(2569, year - 5); y <= year + 10; y++) el('selYear').options.add(new Option(y, y));
    el('selYear').value = year;
  }
  function customCategories() {
    const cats = readLocal('customCategories', []);
    return Array.isArray(cats) ? cats.filter(c => typeof c === 'string') : [];
  }
  function loadCategories() {
    const select = el('taskCategory');
    const previous = select.value;
    select.replaceChildren();
    [...new Set([...defaultCategories, ...customCategories(), ...currentTasks.map(t => t.category)])]
      .forEach(c => select.options.add(new Option(c, c)));
    select.options.add(new Option('✨ + เพิ่มหมวดหมู่ใหม่...', 'NEW'));
    if ([...select.options].some(o => o.value === previous)) select.value = previous;
    checkNewCategory();
  }
  function checkNewCategory() {
    const value = el('taskCategory').value;
    el('newCategoryDiv').classList.toggle('d-none', value !== 'NEW');
    el('btnDeleteCategory').classList.toggle('d-none', !customCategories().includes(value));
  }
  async function deleteCustomCategory() {
    if (!canEdit()) return;
    const value = el('taskCategory').value;
    const token = loadToken;
    const answer = await Swal.fire({title:'ลบหมวดหมู่นี้?', text:value, icon:'warning', showCancelButton:true, confirmButtonText:'ลบ', cancelButtonText:'ยกเลิก'});
    if (!answer.isConfirmed || token !== loadToken || !canEdit()) return;
    writeLocal('customCategories', customCategories().filter(c => c !== value));
    loadCategories();
  }
  function canEdit() {
    return (isReady || dirty) && !isFetching && !isSaving && !conflict && activeRecord && activeRecord.key === selectedRecord().key;
  }
  function updateControls() {
    const disabled = !canEdit();
    document.querySelectorAll('[data-edit]').forEach(node => { node.disabled = disabled; });
    ['selMonth','selYear','empName'].forEach(id => { el(id).disabled = dirty || isSaving; });
    ['empPosition','empType'].forEach(id => { el(id).disabled = disabled; });
    el('retryButton').hidden = !(loadError || dirty);
    el('retryButton').disabled = isSaving || isFetching || conflict;
    el('retryButton').textContent = dirty ? 'ลองบันทึกอีกครั้ง' : 'ลองโหลดอีกครั้ง';
    el('discardButton').hidden = !dirty;
    el('discardButton').disabled = isSaving || isFetching;
    el('backupButton').hidden = !dirty;
  }
  function setStatus(message, kind = 'info') {
    el('syncStatus').textContent = message;
    el('syncPanel').className = `alert alert-${kind} mb-4`;
    updateControls();
  }
  function rpc(method, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('กรุณาเปิดผ่าน URL ของ Apps Script หรือหน้า GitHub Pages ที่ตั้งค่าแล้ว'));
        return;
      }
      // Do not time out writes locally: an unanswered write may still complete on the server.
      google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error.message || String(error))))[method](...args);
    });
  }
  async function loadData() {
    if (dirty || isSaving) return;
    const token = ++loadToken;
    const record = selectedRecord();
    activeRecord = record;
    isReady = false;
    isFetching = false;
    loadError = false;
    conflict = false;
    currentTasks = [];
    revision = '0';
    renderTasks();
    if (!record.fullName) { setStatus('กรุณาระบุชื่อ-สกุลเพื่อเปิดรายงาน', 'warning'); return; }
    const cached = readLocal(record.key);
    const draft = cached && cached.dirty === true && validTasks(cached.tasks) && typeof cached.revision === 'string' ? cached : null;
    if (draft) {
      currentTasks = draft.tasks;
      revision = draft.revision;
      dirty = true;
      el('empPosition').value = draft.position || '';
      if (draft.employeeType) el('empType').value = draft.employeeType;
      renderTasks();
    }
    isFetching = true;
    setStatus(draft ? 'พบฉบับร่างที่ยังไม่บันทึก กำลังตรวจข้อมูลใน Google Sheets…' : 'กำลังโหลดจาก Google Sheets…');
    try {
      const result = await rpc('getRecordFromDatabase', record.monthYear, record.fullName);
      if (token !== loadToken) return;
      if (!result || result.status !== 'success' || !validTasks(result.tasks) || typeof result.revision !== 'string') {
        throw new Error(result && result.message || 'รูปแบบข้อมูลตอบกลับไม่ถูกต้อง');
      }
      isFetching = false;
      isReady = true;
      if (draft) {
        const alreadySaved = result.found && JSON.stringify(result.tasks) === JSON.stringify(draft.tasks) &&
          (result.position || '') === (draft.position || '').trim() && (result.employeeType || '') === (draft.employeeType || '');
        if (alreadySaved) {
          revision = result.revision;
          dirty = false;
          cacheRecord();
          setStatus('ตรวจสอบแล้ว ฉบับร่างนี้บันทึกลง Google Sheets สำเร็จแล้ว', 'success');
        } else {
          conflict = result.revision !== revision;
          setStatus(conflict ? 'ฉบับร่างยังไม่บันทึก และข้อมูลในชีตเปลี่ยนแล้ว กรุณาดาวน์โหลดฉบับร่างก่อนโหลดข้อมูลจากชีตใหม่' : 'พบฉบับร่างที่ยังไม่บันทึก แก้ไขต่อหรือกด “ลองบันทึกอีกครั้ง” เพื่อส่งไป Google Sheets', 'warning');
        }
      } else {
        currentTasks = result.tasks;
        revision = result.revision;
        if (result.found) {
          el('empPosition').value = result.position || '';
          el('empType').value = result.employeeType || 'ข้าราชการ';
        }
        cacheRecord();
        saveProfile();
        setStatus(result.recoveredLegacy ? 'โหลดรายการเดิมแล้ว การแก้ไขครั้งถัดไปจะบันทึกเป็นรูปแบบใหม่' : 'เชื่อมต่อ Google Sheets แล้ว พร้อมบันทึก', 'success');
      }
      loadCategories();
      renderTasks();
    } catch (error) {
      if (token !== loadToken) return;
      isFetching = false;
      loadError = true;
      setStatus(`โหลดไม่สำเร็จ: ${error.message}${draft ? ' — ฉบับร่างยังอยู่ในหน้านี้' : ''}`, 'danger');
    }
  }
  async function syncToDatabase() {
    if (!dirty || isSaving || !activeRecord || conflict) return;
    isSaving = true;
    const payload = { monthYear: activeRecord.monthYear, fullName: activeRecord.fullName,
      position: el('empPosition').value.trim(), employeeType: el('empType').value,
      tasks: JSON.parse(JSON.stringify(currentTasks)), expectedRevision: revision };
    setStatus('กำลังบันทึกไป Google Sheets… กรุณารอ');
    try {
      const result = await rpc('saveRecordToDatabase', payload);
      if (!result || result.status !== 'success' || typeof result.revision !== 'string') {
        conflict = result && result.status === 'conflict';
        throw new Error(result && result.message || 'ไม่พบการยืนยันการบันทึก');
      }
      revision = result.revision;
      dirty = false;
      loadError = false;
      isReady = true;
      cacheRecord();
      saveProfile();
      isSaving = false;
      setStatus('บันทึกลง Google Sheets สำเร็จ', 'success');
    } catch (error) {
      isSaving = false;
      cacheRecord();
      const backup = storageUnavailable ? 'อย่าปิดหน้านี้ กรุณาดาวน์โหลดฉบับร่างเก็บไว้' : 'เก็บฉบับร่างไว้ในเบราว์เซอร์แล้ว';
      setStatus(`ยังไม่บันทึกลงชีต: ${error.message} — ${backup}`, 'danger');
    }
  }
  function commitChanges() {
    dirty = true;
    cacheRecord();
    renderTasks();
    syncToDatabase();
  }
  function profileChanged() {
    saveProfile();
    if (canEdit()) commitChanges();
  }
  function retrySync() {
    if (dirty) syncToDatabase(); else loadData();
  }
  function downloadDraft() {
    if (!activeRecord) return;
    const data = { monthYear: activeRecord.monthYear, fullName: activeRecord.fullName,
      position: el('empPosition').value, employeeType: el('empType').value, tasks: currentTasks };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = `ฉบับร่าง_${activeRecord.year}_${activeRecord.month}.json`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }
  async function discardDraft() {
    if (!dirty || isSaving) return;
    const answer = await Swal.fire({title:'โหลดข้อมูลจากชีตใหม่?', text:'ฉบับร่างที่ยังไม่บันทึกจะถูกแทนที่ กรุณาดาวน์โหลดฉบับร่างก่อนหากต้องการเก็บไว้', icon:'warning', showCancelButton:true, confirmButtonText:'โหลดจากชีตใหม่', cancelButtonText:'ยกเลิก'});
    if (!answer.isConfirmed || isSaving) return;
    dirty = false;
    cacheRecord();
    await loadData();
  }
  function addTask() {
    if (!canEdit()) return;
    const detail = el('taskDetail').value.trim();
    if (!detail) return Swal.fire('แจ้งเตือน','กรุณาระบุรายละเอียดงาน','warning');
    let category = el('taskCategory').value;
    if (category === 'NEW') {
      const name = el('newCategoryInput').value.trim();
      if (!name) return Swal.fire('แจ้งเตือน','กรุณาระบุชื่อหมวดหมู่ใหม่','warning');
      const saved = customCategories();
      const next = Math.max(0, ...[...defaultCategories,...saved,...currentTasks.map(t => t.category)].map(c => Number((c.match(/^\d+/) || ['0'])[0]))) + 1;
      category = `${next}. ${name}`;
      writeLocal('customCategories', [...saved, category]);
      loadCategories();
      el('taskCategory').value = category;
      checkNewCategory();
      el('newCategoryInput').value = '';
    }
    if (detail.length > 10000 || category.length > 500) return Swal.fire('ข้อความยาวเกินไป','กรุณาแบ่งรายละเอียดเป็นรายการย่อย','warning');
    const id = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    currentTasks.push({id, category, detail});
    el('taskDetail').value = '';
    commitChanges();
  }
  async function deleteTask(id) {
    if (!canEdit()) return;
    const token = loadToken;
    const answer = await Swal.fire({title:'ลบรายการนี้?', icon:'warning', showCancelButton:true, confirmButtonText:'ลบ', cancelButtonText:'ยกเลิก'});
    if (!answer.isConfirmed || token !== loadToken || !canEdit()) return;
    currentTasks = currentTasks.filter(t => t.id !== id);
    commitChanges();
  }
  async function editTask(id) {
    if (!canEdit()) return;
    const task = currentTasks.find(t => t.id === id);
    if (!task) return;
    const token = loadToken;
    const answer = await Swal.fire({title:'✏️ แก้ไขผลงาน', input:'textarea', inputValue:task.detail,
      showCancelButton:true, confirmButtonText:'บันทึก', cancelButtonText:'ยกเลิก',
      inputValidator:value => !value.trim() ? 'กรุณาระบุรายละเอียดงาน' : value.length > 10000 ? 'ข้อความยาวเกินไป' : undefined});
    if (!answer.isConfirmed || token !== loadToken || !canEdit()) return;
    task.detail = answer.value.trim();
    commitChanges();
  }
  function moveTask(id, direction) {
    if (!canEdit()) return;
    const index = currentTasks.findIndex(t => t.id === id);
    if (index < 0) return;
    const step = direction === 'up' ? -1 : 1;
    for (let target = index + step; target >= 0 && target < currentTasks.length; target += step) {
      if (currentTasks[target].category === currentTasks[index].category) {
        [currentTasks[index], currentTasks[target]] = [currentTasks[target], currentTasks[index]];
        commitChanges(); return;
      }
    }
  }
  function renderTasks() {
    const container = el('taskListContainer');
    container.replaceChildren();
    if (!currentTasks.length) {
      const empty = document.createElement('div');
      empty.className = 'text-muted text-center py-5 bg-white rounded-3 border';
      empty.textContent = '☁️ ยังไม่มีผลงานในเดือนนี้';
      container.appendChild(empty);
    }
    const groups = new Map();
    currentTasks.forEach(task => {
      if (!groups.has(task.category)) groups.set(task.category, []);
      groups.get(task.category).push(task);
    });
    groups.forEach((tasks, category) => {
      const section = document.createElement('section');
      const heading = document.createElement('h6');
      heading.className = 'mt-4 fw-bold text-primary border-bottom pb-2';
      heading.textContent = category;
      section.appendChild(heading);
      tasks.forEach(task => {
        const row = document.createElement('div');
        row.className = 'task-item d-flex justify-content-between align-items-center gap-2';
        const text = document.createElement('div');
        text.className = 'task-detail';
        text.textContent = task.detail;
        const buttons = document.createElement('div');
        buttons.className = 'btn-group bg-white rounded shadow-sm';
        [['✏️','แก้ไข',() => editTask(task.id)],['🔼','เลื่อนขึ้น',() => moveTask(task.id,'up')],['🔽','เลื่อนลง',() => moveTask(task.id,'down')],['🗑️','ลบ',() => deleteTask(task.id)]].forEach(([label,title,callback]) => {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'btn btn-sm btn-light';
          button.textContent = label; button.title = title;
          button.setAttribute('aria-label', title);
          button.setAttribute('data-edit',''); button.disabled = !canEdit();
          button.addEventListener('click', callback); buttons.appendChild(button);
        });
        row.append(text, buttons); section.appendChild(row);
      });
      container.appendChild(section);
    });
    updateControls();
  }
  window.addEventListener('load', () => {
    initSelects(); loadProfile(); loadCategories(); loadData();
    el('empName').addEventListener('input', updateControls);
    el('taskDetail').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); addTask(); }
    });
  });
  window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
  // APP_CONTROLLER_END

  function toThaiNum(numStr) {
    const thaiNums = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
    return numStr.toString().replace(/\d/g, d => thaiNums[d]);
  }

  async function generateWord() {
    if (!activeRecord || isFetching || (!isReady && !dirty) || activeRecord.key !== selectedRecord().key) {
      return Swal.fire('กรุณารอ', 'โหลดรายงานให้สำเร็จก่อนส่งออกไฟล์', 'warning');
    }
    if (!window.docx || typeof saveAs !== 'function') {
      return Swal.fire('โหลดเครื่องมือไม่สำเร็จ', 'กรุณาตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วเปิดหน้าใหม่', 'error');
    }
    try {
    const docx = window.docx;

    function createRun(text, isBold = false, isUnderline = false) {
      let options = {
        text: text,
        font: "TH SarabunIT๙",
        size: 32, // 16 pt
        bold: isBold,
        noProof: true 
      };
      if (isUnderline) { options.underline = {}; }
      return new docx.TextRun(options);
    }

    const monthNum = parseInt(document.getElementById('selMonth').value);
    const monthStr = thaiMonths[monthNum - 1];
    let yearBE = parseInt(document.getElementById('selYear').value);
    const name = document.getElementById('empName').value;
    const position = document.getElementById('empPosition').value;
    const type = document.getElementById('empType').value;

    let fiscalYearBE = yearBE;
    if (monthNum >= 10) {
      fiscalYearBE = yearBE + 1;
    }

    const isKharachakan = type === "ข้าราชการ";
    const box1 = isKharachakan ? "☑ ข้าราชการ" : "☐ ข้าราชการ";
    const box2 = !isKharachakan ? "☑ พนักงานราชการ" : "☐ พนักงานราชการ";

    const bNone = { style: docx.BorderStyle.NONE, size: 0, color: "auto" };
    const bSingle = { style: docx.BorderStyle.SINGLE, size: 1, color: "000000" };
    
    const tableBorders = {
        top: bSingle, bottom: bSingle, left: bSingle, right: bSingle,
        insideVertical: bSingle,
        insideHorizontal: bNone 
    };

    const headerCellBorders = { bottom: bSingle };
    const footerCellBorders = { top: bSingle, bottom: bSingle };

    let grouped = Object.create(null);
    let allCats = Array.from(document.getElementById('taskCategory').options).map(o => o.value).filter(v => v !== "NEW");
    allCats.forEach(c => grouped[c] = []); 
    currentTasks.forEach(t => {
      if(grouped[t.category]) grouped[t.category].push(t);
      else grouped[t.category] = [t]; 
    });

    let tableRows = [
      new docx.TableRow({
        children: [
          new docx.TableCell({ borders: headerCellBorders, children: [new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [createRun("งานในหน้าที่ประจำที่ปฏิบัติจริงในช่วงเดือนนี้", true)] })] }),
          new docx.TableCell({ borders: headerCellBorders, children: [new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [createRun("ผลการปฏิบัติงาน/ผลความคืบหน้าของงาน\n(ขั้นตอนการดำเนินงาน)", true)] })] })
        ]
      })
    ];

    for (const [cat, tasks] of Object.entries(grouped)) {
      if(tasks.length === 0) continue; 

      let taskRuns = [];
      tasks.forEach((t) => {
        let textParts = t.detail.split(/\r?\n/);
        textParts.forEach((part) => {
           let cleanPart = part.replace(/^[-•–\s]+/, '').trim();
           if(cleanPart) {
             let thaiPart = toThaiNum("-" + "\u00A0" + cleanPart);
             taskRuns.push(new docx.Paragraph({ children: [createRun(thaiPart, false)] }));
           }
        });
      });

      tableRows.push(new docx.TableRow({
        children: [
          new docx.TableCell({ children: [new docx.Paragraph({ children: [createRun(toThaiNum(cat), true)] })] }),
        new docx.TableCell({ children: taskRuns.length ? taskRuns : [new docx.Paragraph('')] })
        ]
      }));
    }

    tableRows.push(new docx.TableRow({
      children: [
        new docx.TableCell({ borders: footerCellBorders, children: [new docx.Paragraph({ children: [createRun("ปัญหา/อุปสรรคที่เกิดขึ้นในงานที่ปฏิบัติจริงในช่วงเดือนนี้", true)] })] }),
        new docx.TableCell({ borders: footerCellBorders, children: [new docx.Paragraph({ children: [createRun("-", false)] })] })
      ]
    }));
    tableRows.push(new docx.TableRow({
      children: [
        new docx.TableCell({ borders: footerCellBorders, children: [new docx.Paragraph({ children: [createRun("ข้อคิดเห็น/ข้อเสนอแนะจาก หัวหน้ากลุ่มงาน หรือหัวหน้างาน ที่ช่วยแก้ปัญหา/ทำให้งานดำเนินการต่อได้", true)] })] }),
        new docx.TableCell({ borders: footerCellBorders, children: [new docx.Paragraph({ children: [createRun("-", false)] })] })
      ]
    }));

    const doc = new docx.Document({
      sections: [{
        properties: {
          page: {
            margin: {
              top: 1440,
              bottom: 1440,
              left: 850,
              right: 850,
            }
          }
        },
        children: [
          new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [createRun(`แบบรายงานผลการปฏิบัติงานประจำเดือน ${monthStr} ${toThaiNum(yearBE)}`, true)] }),
          new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [createRun(`ของบุคลากร กลุ่มสื่อสารองค์กร สลก. ประจำปีงบประมาณ พ.ศ. ${toThaiNum(fiscalYearBE)}`, true)] }),
          new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, children: [createRun(`ชื่อ ${name} ตำแหน่ง ${position}`, true)] }),
          
          new docx.Paragraph({ alignment: docx.AlignmentType.CENTER, spacing: { before: 200, after: 200 }, children: [createRun(`${box1}       ${box2}`, false)] }),

          new docx.Table({
            width: { size: 100, type: docx.WidthType.PERCENTAGE },
            columnWidths: [4500, 6500],
            borders: tableBorders,
            rows: tableRows
          }),

          new docx.Paragraph({ spacing: { before: 400 }, children: [createRun("สรุปวันปฏิบัติงาน และวันลา", true, true), createRun(" (ในรอบเดือนนี้)", false)] }),
          new docx.Paragraph({ children: [createRun("ไปราชการนอกสถานที่/อบรม ........ วัน   ลาป่วย ........ วัน   ลาพักผ่อน  จำนวน ........ วัน", false)] }),
          
          new docx.Paragraph({ text: "" }),
          new docx.Paragraph({ text: "" }),

          new docx.Table({
            width: { size: 100, type: docx.WidthType.PERCENTAGE },
            borders: { top: bNone, bottom: bNone, left: bNone, right: bNone, insideHorizontal: bNone, insideVertical: bNone },
            rows: [
              new docx.TableRow({
                children: [
                  new docx.TableCell({ width: { size: 55, type: docx.WidthType.PERCENTAGE }, children: [] }), 
                  new docx.TableCell({ width: { size: 15, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 120 }, children: [createRun("ลงชื่อ", true)] })] }),
                  new docx.TableCell({ width: { size: 30, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 120 }, children: [createRun("ผู้รายงานผล", true)] })] })
                ]
              }),
              new docx.TableRow({
                children: [
                  new docx.TableCell({ width: { size: 55, type: docx.WidthType.PERCENTAGE }, children: [] }), 
                  new docx.TableCell({ width: { size: 15, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 120 }, children: [createRun("ลงชื่อ", true)] })] }),
                  new docx.TableCell({ width: { size: 30, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 120 }, children: [createRun("ผู้ตรวจสอบ", true)] })] })
                ]
              }),
              new docx.TableRow({
                children: [
                  new docx.TableCell({ width: { size: 55, type: docx.WidthType.PERCENTAGE }, children: [] }),
                  new docx.TableCell({ width: { size: 15, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 0 }, children: [createRun("ลงชื่อ", true)] })] }),
                  new docx.TableCell({ width: { size: 30, type: docx.WidthType.PERCENTAGE }, children: [new docx.Paragraph({ spacing: { after: 0 }, children: [createRun("หัวหน้ากลุ่มสื่อสารองค์กร", true)] })] })
                ]
              })
            ]
          })
        ]
      }]
    });

    const blob = await docx.Packer.toBlob(doc);
    saveAs(blob, `รายงานผลการปฏิบัติงาน_${name}_${monthStr}_${yearBE}.docx`);
    } catch (error) {
      Swal.fire('สร้างไฟล์ Word ไม่สำเร็จ', error.message, 'error');
    }
  }
</script>
